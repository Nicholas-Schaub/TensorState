name: Test

# Run on push to protected branches AND on every PR. Dropping push:[dev]
# avoids the double-run that fires both push + pull_request when a PR is
# already open from dev. Feature branches still get tested via their PRs.
on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu only for now — macOS/Windows are listed as future targets
        # but their pytest runs have been failing pre-existing issues
        # (Triton-on-non-Linux, multiprocessing.spawn quirks) that are
        # out of scope for the entropy-regularization paper work.
        os: [ubuntu-latest]
        python-version: ["3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dev dependencies
        run: uv sync --group dev

      - name: Build Rust extension in place
        run: uv run maturin develop --release

      - name: Run pytest
        run: uv run pytest --benchmark-disable -q
