name: Docs

# Docs keep push:[dev] so the gh-pages deploy step at the bottom of this
# file still fires on push to dev. The build itself runs on PRs too so a
# PR breaks gh-pages-ably before merge.
on:
  push:
    branches: [master, main, dev]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --group dev

      - name: Build docs
        run: uv run mkdocs build --strict

      - name: Deploy to GitHub Pages
        # Deploy from `dev` (the active development branch) until v0.5.0
        # is cut to master. Once a stable release ships, switch this back
        # to master / main.
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: uv run mkdocs gh-deploy --force
