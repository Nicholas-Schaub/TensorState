name: Docs

on:
  push:
    branches: [master, main, dev]
  pull_request:
    branches: [master, main, dev]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --group dev

      - name: Build docs
        # Note: --strict is intentionally omitted while the source has
        # docstrings with missing type annotations (35 griffe warnings).
        # Fix the docstrings in a follow-up, then re-enable --strict.
        run: uv run mkdocs build

      - name: Deploy to GitHub Pages
        # Deploy from `dev` (the active development branch) until v0.5.0
        # is cut to master. Once a stable release ships, switch this back
        # to master / main.
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: uv run mkdocs gh-deploy --force
