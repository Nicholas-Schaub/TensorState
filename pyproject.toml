[project]
name = "TensorState"
version = "0.5.0-dev1"
description = "Neural network state-space analysis and entropy/efficiency tooling."
authors = [
    { name = "Nicholas Schaub", email = "nicholas.j.schaub@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.26,<3.0",
    "zarr>=2.18,<3.0",
    "numcodecs>=0.13,<0.16",
    "grandalf>=0.8,<0.9",
    "pydantic>=2.0,<3.0",
    "torch>=2.10.0,<2.11.0",
    "torchvision>=0.25.0,<0.26.0",
]

[project.optional-dependencies]
examples = [
    "lightning>=2.2,<3.0",
    "matplotlib>=3.8,<4.0",
]

[project.urls]
Homepage = "https://github.com/Nicholas-Schaub/TensorState"
Documentation = "https://nicholas-schaub.github.io/TensorState/"
Issues = "https://github.com/Nicholas-Schaub/TensorState/issues"

[dependency-groups]
dev = [
    "cython>=3.0",
    "black>=24.0",
    "mypy>=1.10",
    "ruff>=0.4",
    "pre-commit>=3.7",
    "bump-my-version>=0.21",
    "pytest>=8.0",
    "pytest-benchmark>=4.0",
    "pytest-sugar>=1.0",
    "pytest-xdist>=3.5",
    "pytest-cov>=5.0",
    "nox>=2024.4",
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "mkdocs-section-index>=0.3",
]

[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[tool.maturin]
# The Rust extension is exposed as `TensorState._TensorState_rs` so it can
# coexist with the (now-optional) Cython extension `TensorState._TensorState`,
# which is kept in-tree for regression testing only and built via
# `scripts/build-cython.sh` on demand.
module-name = "TensorState._TensorState_rs"
manifest-path = "crates/tensorstate-core/Cargo.toml"
python-source = "src"
features = ["pyo3/extension-module"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "D"]
ignore = ["D100", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
